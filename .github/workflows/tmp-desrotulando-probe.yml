name: Temporary Desrotulando Probe

on:
  push:
    paths:
      - ".github/workflows/tmp-desrotulando-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download APK
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://d.apkpure.net/b/APK/com.desrotulando.app?versionCode=3092"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=180) as r, open("app.apk","wb") as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          PY
          unzip -q app.apk -d apk
      - name: Inspect endpoint context without credentials
        run: |
          APP_SO=$(find apk -path "*/libapp.so" | head -n 1)
          strings -n 3 "$APP_SO" > /tmp/strings.txt
          for needle in "ScanService|findByBarcode" "SearchAPI" "SearchService" "product/list" "products/{productID}" "products/{code}/{action}" "product_score" "product_ean" "getProductListItems"; do
            echo "===== CONTEXT: $needle ====="
            grep -n -F -m 3 -B 35 -A 35 "$needle" /tmp/strings.txt || true
          done
          echo "===== NON-SECRET HTTP PARAMETER NAMES ====="
          grep -Ei '^(ean|barcode|code|product_id|productID|product_ean|query|searchText|search|page|limit|offset|action|product_score|score)$' /tmp/strings.txt | sort -u || true
