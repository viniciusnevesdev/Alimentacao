name: Temporary Desrotulando Probe

on:
  push:
    paths:
      - ".github/workflows/tmp-desrotulando-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download APK
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://d.apkpure.net/b/APK/com.desrotulando.app?versionCode=3092"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=180) as r, open("app.apk","wb") as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
          PY
          unzip -q app.apk -d apk
      - name: Inspect app strings
        run: |
          APP_SO=$(find apk -path "*/libapp.so" | head -n 1)
          echo "APP_SO=$APP_SO"
          echo "=== ENDPOINT-LIKE STRINGS ==="
          strings -n 3 "$APP_SO" | grep -Ei 'api\.desrotulando|food.?score|barcode|gtin|ean|product|produto|search|busca|category|categoria|score|rating|nutrition|nutri' | head -n 2500 || true
          echo "=== AUTH / HEADER STRINGS ==="
          strings -n 3 "$APP_SO" | grep -Ei 'authorization|bearer|x-api|api.?key|token|jwt|firebase.?auth|id.?token|access.?token|refresh.?token|client.?id' | head -n 1000 || true
          echo "=== PATH-LIKE STRINGS ==="
          strings -n 3 "$APP_SO" | grep -E '^/[A-Za-z0-9._~!$&()*+,;=:@%/?#-]{2,}$' | grep -Ei 'product|produto|barcode|ean|gtin|search|score|category|categoria|nutrition|user|auth' | head -n 1500 || true
      - name: Probe public API surface
        run: |
          base='https://api.desrotulando.com/prod'
          for p in '' '/' '/swagger' '/swagger.json' '/openapi.json' '/docs' '/products' '/product' '/search' '/categories'; do
            echo "=== GET $base$p ==="
            code=$(curl -L -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$base$p" || true)
            echo "HTTP $code"
            head -c 800 /tmp/body 2>/dev/null || true
            echo
          done
