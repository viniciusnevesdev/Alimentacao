<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10a66f">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NutriTrack Beta">
  <title>NutriTrack Beta</title>
  <link rel="manifest" href="./manifest.webmanifest?v=11">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=11">\n  <link rel="icon" type="image/png" href="./favicon.png?v=11">\n  <link rel="stylesheet" href="./styles.css?v=6">
  <link rel="stylesheet" href="../layout-fixes.css?v=6">
  <link rel="stylesheet" href="./tab-animation.css?v=9">
  <style>.beta-boot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#0f172a;background:#f8fafc}.beta-boot p{color:#64748b}</style>
</head>
<body>
  <div class="beta-boot" id="betaBoot"><div><h1>NutriTrack Beta</h1><p>Carregando ambiente de testes…</p></div></div>
  <script>
  (async()=>{
    try{
      const response=await fetch('./base-index.html?v=11',{cache:'no-store'});
      if(!response.ok) throw new Error('Falha ao carregar a interface');
      const source=await response.text();
      let body=source.match(/<body>([\s\S]*?)<\/body>/i)?.[1];
      if(!body) throw new Error('Estrutura da interface não encontrada');
      body=body
        .replace(/<script\s+src="nutrition-data\.js"><\/script>/i,'')
        .replace(/<script\s+src="app\.js"><\/script>/i,'')
        .replace('<span class="badge">PRO</span>','<span class="badge">PRO · BETA</span>');
      document.body.innerHTML=body;

      const nutrition=document.createElement('script');
      nutrition.src='./nutrition-data.js?v=6';
      nutrition.onload=()=>{
        const app=document.createElement('script');
        app.src='./app.js?v=6';
        app.onload=()=>{
          const animation=document.createElement('script');
          animation.src='./tab-animation.js?v=9';
          document.body.appendChild(animation);
        };
        document.body.appendChild(app);
      };
      nutrition.onerror=()=>{throw new Error('Falha ao carregar base nutricional')};
      document.body.appendChild(nutrition);
    }catch(error){
      console.error('[NutriTrack Beta]',error);
      document.body.innerHTML='<div class="beta-boot"><div><h1>Não foi possível abrir a Beta</h1><p>Atualize a página e tente novamente.</p><p><a href="../menu.html">Voltar ao Menu Geral</a></p></div></div>';
    }
  })();
  </script>
</body>
</html>
